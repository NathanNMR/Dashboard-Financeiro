name: Package render-ready

on:
  push:
    branches: ["chatgpt/render-ready"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=zip --output=Dashboard-Financeiro-render-ready.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Dashboard-Financeiro-render-ready
          path: Dashboard-Financeiro-render-ready.zip
          if-no-files-found: error
