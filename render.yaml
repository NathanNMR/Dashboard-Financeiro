services:
  - type: web
    name: smartfinance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health.php
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "86400"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: smartfinance
    runtime: static
    buildCommand: npm ci && npm run typecheck && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
