services:
  - type: web
    name: smartfinance-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health.php
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        value: jurassihealth-mysql-nathannmr.d.aivencloud.com
      - key: DB_PORT
        value: "20110"
      - key: DB_NAME
        value: smartfinance
      - key: DB_USER
        value: smartfinance_app
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: DB_MIGRATE_USER
        value: avnadmin
      - key: DB_MIGRATE_PASSWORD
        sync: false
      - key: RUN_DB_MIGRATION
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "86400"
      - key: ALLOWED_ORIGINS
        value: https://nmrfinance.netlify.app
      - key: FRONTEND_URL
        value: https://nmrfinance.netlify.app
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
